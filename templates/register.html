<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Регистрация — Mace Launcher</title>

    <link
        rel="icon"
        type="image/png"
        href="{{ url_for('static', filename='icon.png') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename=css_file) }}"
    >

</head>


<body>

    <div class="account-page">

        <div class="account-card">

            <div class="account-logo">

                Ⓜ️ Mace Launcher

            </div>


            <h1>

                Регистрация

            </h1>


            <p class="account-description">

                Создайте аккаунт Mace Launcher

            </p>


            <!-- Форма -->

            <form id="registerForm">


                <label>

                    Имя

                </label>

                <input

                    type="text"

                    id="username"

                    placeholder="Введите имя"

                    minlength="3"

                    maxlength="32"

                    required

                >


                <label>

                    Почта

                </label>

                <input

                    type="email"

                    id="email"

                    placeholder="Введите почту"

                    required

                >


                <label>

                    Пароль

                </label>

                <input

                    type="password"

                    id="password"

                    placeholder="Введите пароль"

                    minlength="6"

                    required

                >


                <button
                    type="submit"
                    class="account-submit register-submit"
                >

                    Зарегистрироваться

                </button>


            </form>


            <div
                id="message"
                class="account-message"
            ></div>


            <p class="account-switch">

                Уже есть аккаунт?

                <a href="/login">

                    Войти

                </a>

            </p>


            <a
                href="/"
                class="back-home"
            >

                ← Вернуться на главную

            </a>


        </div>

    </div>


    <script>

        // ======================================
        // АДРЕС MaceHost
        //
        // Пока локальный сервер.
        // Позже заменим на Koyeb URL.
        // ======================================

        const MACE_HOST =
            "http://127.0.0.1:8000";


        // ======================================
        // Регистрация
        // ======================================

        document
            .getElementById("registerForm")

            .addEventListener(

                "submit",

                async function(event) {

                    event.preventDefault();


                    const username =

                        document
                            .getElementById(
                                "username"
                            )

                            .value

                            .trim();


                    const email =

                        document
                            .getElementById(
                                "email"
                            )

                            .value

                            .trim();


                    const password =

                        document
                            .getElementById(
                                "password"
                            )

                            .value;


                    const messageElement =

                        document
                            .getElementById(
                                "message"
                            );


                    messageElement.textContent =

                        "Регистрация...";


                    try {

                        const response =

                            await fetch(

                                `${MACE_HOST}/register`,

                                {

                                    method: "POST",

                                    headers: {

                                        "Content-Type":

                                            "application/json"

                                    },

                                    body:

                                        JSON.stringify({

                                            username:

                                                username,

                                            email:

                                                email,

                                            password:

                                                password

                                        })

                                }

                            );


                        const data =

                            await response.json();


                        // =========================
                        // Ошибка
                        // =========================

                        if (!response.ok) {

                            messageElement.textContent =

                                data.detail
                                ||
                                "Ошибка регистрации";

                            messageElement.className =

                                "account-message error";

                            return;

                        }


                        // =========================
                        // Успех
                        // =========================

                        messageElement.innerHTML =

                            `
                            <strong>
                                Аккаунт создан!
                            </strong>

                            <br><br>

                            Имя:
                            ${data.username}

                            <br>

                            MaceId:
                            ${data.mace_id}
                            `;


                        messageElement.className =

                            "account-message success";


                    }

                    catch (error) {

                        console.error(error);


                        messageElement.textContent =

                            "Не удалось подключиться "
                            +
                            "к MaceHost";


                        messageElement.className =

                            "account-message error";

                    }

                }

            );

    </script>


</body>

</html>
