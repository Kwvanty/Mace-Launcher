<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mace Launcher Admin Dashboard</title>
    <style>
        body { background-color: #0f111a; color: #f1f5f9; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .admin-box { background: #1e2337; padding: 40px; border-radius: 12px; border: 1px solid #2e344e; width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #38bdf8; }
        input[type="password"], select, input[type="file"] { width: 100%; padding: 10px; margin: 10px 0 20px 0; border-radius: 6px; border: 1px solid #3b4366; background: #161927; color: #fff; box-sizing: border-box; }
        button { background: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #0369a1; }
        .alert { padding: 10px; border-radius: 6px; margin-bottom: 20px; font-size: 0.9rem; }
        .alert.error { background: #7f1d1d; color: #fca5a5; }
        .alert.success { background: #14532d; color: #86efac; }
        .alert.warning { background: #713f12; color: #fde047; }
        .logout-btn { background: #dc2626; margin-top: 15px; }
        .logout-btn:hover { background: #b91c1c; }
    </style>
</head>
<body>
    <div class="admin-box">
        <h2>🔒 Mace Admin Panel</h2>
        
        {% if msg %}
            <div class="alert {{ status_type }}">{{ msg }}</div>
        {% endif %}

        {% if not logged_in %}
            <form method="POST">
                <input type="hidden" name="action" value="login">
                <label>Admin Password (SHA-256 Protected):</label>
                <input type="password" name="password" required placeholder="Enter password...">
                <button type="submit">Login</button>
            </form>
        {% else %}
            <form method="POST" enctype="multipart/form-data">
                <input type="hidden" name="action" value="upload">
                <label>Upload Target Directory:</label>
                <select name="upload_type">
                    <option value="installer">Installer (Mace Installer/)</option>
                    <option value="update">Update (update/)</option>
                </select>

                <label>Select File:</label>
                <input type="file" name="file" required>

                <button type="submit">Upload & Push to GitHub</button>
            </form>

            <form method="POST">
                <input type="hidden" name="action" value="logout">
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        {% endif %}
    </div>
</body>
</html>
