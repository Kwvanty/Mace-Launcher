<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mace Launcher Admin Dashboard</title>
    <style>
        body { 
            background-color: #0f111a; 
            color: #f1f5f9; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        .admin-box { 
            background: #1e2337; 
            padding: 35px; 
            border-radius: 12px; 
            border: 1px solid #2e344e; 
            width: 450px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }
        h2 { 
            margin-top: 0; 
            color: #38bdf8; 
            text-align: center; 
        }
        h3 { 
            color: #f1f5f9; 
            font-size: 1.1rem; 
            border-bottom: 1px solid #2e344e; 
            padding-bottom: 8px; 
            margin-top: 0; 
            margin-bottom: 15px; 
        }
        label { 
            display: block; 
            margin-bottom: 5px; 
            font-size: 0.85rem; 
            color: #94a3b8; 
        }
        input[type="text"], 
        input[type="password"], 
        select, 
        input[type="file"], 
        textarea { 
            width: 100%; 
            padding: 10px; 
            margin-bottom: 15px; 
            border-radius: 6px; 
            border: 1px solid #3b4366; 
            background: #161927; 
            color: #fff; 
            box-sizing: border-box; 
            font-family: inherit; 
        }
        textarea { 
            resize: vertical; 
            min-height: 60px; 
        }
        button { 
            background: #0284c7; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%; 
            margin-top: 5px; 
            transition: background 0.2s; 
        }
        button:hover { 
            background: #0369a1; 
        }
        .alert { 
            padding: 10px; 
            border-radius: 6px; 
            margin-bottom: 20px; 
            font-size: 0.9rem; 
        }
        .alert.error { background: #7f1d1d; color: #fca5a5; }
        .alert.success { background: #14532d; color: #86efac; }
        .alert.warning { background: #713f12; color: #fde047; }
        .logout-btn { 
            background: #dc2626; 
            margin-top: 15px; 
        }
        .logout-btn:hover { 
            background: #b91c1c; 
        }
        .section-box { 
            background: #161927; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            border: 1px solid #2a3047; 
        }
    </style>
</head>
<body>
    <div class="admin-box">
        <h2>🔒 Mace Admin Panel</h2>
        
        {% if msg %}
            <div class="alert {{ status_type }}">{{ msg }}</div>
        {% endif %}

        {% if not logged_in %}
            <form method="POST">
                <input type="hidden" name="action" value="login">
                <label>Admin Password (SHA-256 Protected):</label>
                <input type="password" name="password" required placeholder="Enter password...">
                <button type="submit">Login</button>
            </form>
        {% else %}

            <div class="section-box">
                <h3>📁 Upload File & Push</h3>
                <form method="POST" enctype="multipart/form-data">
                    <input type="hidden" name="action" value="upload">
                    <label>Upload Target Directory:</label>
                    <select name="upload_type">
                        <option value="installer">Installer (Mace Installer/)</option>
                        <option value="update">Update (update/)</option>
                    </select>

                    <label>Select File:</label>
                    <input type="file" name="file" required>

                    <button type="submit">Upload & Push to GitHub</button>
                </form>
            </div>

            <div class="section-box">
                <h3>🚀 Add Update to Patch Notes</h3>
                <form method="POST">
                    <input type="hidden" name="action" value="add_patch">
                    
                    <label>Version Number (e.g. 1.0.4):</label>
                    <input type="text" name="version" required placeholder="1.0.4">

                    <label>Description (English 🇬🇧):</label>
                    <textarea name="desc_en" required placeholder="Added new feature..."></textarea>

                    <label>Description (Русский 🇷🇺):</label>
                    <textarea name="desc_ru" required placeholder="Добавлена новая функция..."></textarea>

                    <label>Description (Українська 🇺🇦):</label>
                    <textarea name="desc_uk" required placeholder="Додано нову функцію..."></textarea>

                    <button type="submit">Add Update & Push Git</button>
                </form>
            </div>

            <form method="POST">
                <input type="hidden" name="action" value="logout">
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        {% endif %}
    </div>
</body>
</html>
